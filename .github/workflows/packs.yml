name: Build Unsigned iOS and macOS Apps

on:
  push:
    branches:
      - main
      - develop
      - issue-*
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build Xcode Workspace
        run: |
          cd Balance && \
          xcodebuild build \
            -project Balance.xcodeproj \
            -scheme Balance \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          mv Balance/build/DerivedData/Build/Products/Release-iphoneos/Balance.app build/Payload/
          cd build && zip -r Balance.ipa Payload/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: Balance/build/Balance.ipa

  build-macos:
    name: Build macOS ZIP
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build macOS App
        run: |
          cd Balance && \
          xcodebuild build \
            -project Balance.xcodeproj \
            -scheme BalanceMac \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Compress macOS App
        run: |
          cd Balance/build/DerivedData/Build/Products/Release
          mv -v BalanceMac.app Balance.app
          zip -r Balance.zip Balance.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-zip
          path: Balance/build/DerivedData/Build/Products/Release/Balance.zip
